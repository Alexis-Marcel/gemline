apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemline-gamesvc
  namespace: gemline
  labels:
    app: gemline-gamesvc
spec:
  # Game logic tier: each live game is owned by exactly one of these pods
  # (Postgres leases + fencing) which runs its clock, bots and outcome
  # writes. No public listener — the only surface is the internal port,
  # reached by gateways (owner-addressed or via the gemline-gamesvc
  # Service) and by sibling gamesvc pods. Matchmaker and orphan sweeper
  # run here on every replica.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gemline-gamesvc
  template:
    metadata:
      labels:
        app: gemline-gamesvc
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gemline-gamesvc
      containers:
        - name: gamesvc
          image: ghcr.io/alexis-marcel/gemline-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: internal
              containerPort: 8090
          envFrom:
            - secretRef:
                name: gemline-env
          env:
            - name: ROLE
              value: "gamesvc"
            - name: INTERNAL_ADDR
              value: ":8090"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ADVERTISE_ADDR
              value: "$(POD_IP):8090"
            - name: REDIS_URL
              value: "redis://gemline-redis:6379"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "gemline-gamesvc"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=gemline,k8s.pod.name=$(POD_NAME)"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: internal
            initialDelaySeconds: 2
            periodSeconds: 5
          # Give in-flight forwarded commands time to drain; the lease
          # release in the shutdown path hands games over immediately.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
