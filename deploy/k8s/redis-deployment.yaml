apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemline-redis
  namespace: gemline
  labels:
    app: gemline-redis
spec:
  # Single replica, no persistence: this Redis only carries pub/sub fan-out
  # and holds no state worth keeping. If it dies, pods reconnect (go-redis
  # re-subscribes) and clients resync via seq catch-up.
  replicas: 1
  selector:
    matchLabels:
      app: gemline-redis
  template:
    metadata:
      labels:
        app: gemline-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
